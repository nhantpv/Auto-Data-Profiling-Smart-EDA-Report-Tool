<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart EDA Report - {file_name}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>{css_content}</style>
</head>
<body>
  <div class="report-shell">
    <header class="report-header">
      <div class="verdict-banner verdict-{verdict_class}">
        <div class="verdict-symbol" aria-hidden="true">{verdict_icon}</div>
        <div class="verdict-copy">
          <p class="eyebrow">Smart EDA Verdict</p>
          <h1>{verdict_value}</h1>
          <p class="verdict-rationale">{verdict_rationale}</p>
        </div>
      </div>

      <dl class="dataset-meta" aria-label="Dataset metadata">
        <div><dt>File</dt><dd>{file_name}</dd></div>
        <div><dt>Rows</dt><dd>{n}</dd></div>
        <div><dt>Columns</dt><dd>{n_var}</dd></div>
        <div><dt>Missing</dt><dd>{p_cells_missing}</dd></div>
      </dl>
    </header>

    <nav class="tab-bar" role="tablist" aria-label="Report sections">
      <button id="tab-button-ai" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="tab-ai" data-tab="ai">AI Analysis</button>
      <button id="tab-button-stats" class="tab" type="button" role="tab" aria-selected="false" aria-controls="tab-stats" data-tab="stats">Statistical Details</button>
    </nav>

    <main class="tab-panels">
      <section id="tab-ai" class="tab-content active" role="tabpanel" aria-labelledby="tab-button-ai">
        {ai_analysis_content}
      </section>

      <section id="tab-stats" class="tab-content" role="tabpanel" aria-labelledby="tab-button-stats" hidden>
        <iframe srcdoc="{ydata_escaped}" class="ydata-frame" title="Statistical details from ydata profiling"></iframe>
      </section>
    </main>

    <footer class="report-footer">
      <span>Guardrail: {guardrail_status}</span>
      <span>Provider: {provider}</span>
      <span>Model: {model_info}</span>
      <span>Generated: {timestamp}</span>
    </footer>
  </div>
  <script>{js_content}</script>
</body>
</html>
