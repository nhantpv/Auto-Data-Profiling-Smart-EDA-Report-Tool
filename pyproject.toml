[project]
name = "smart-eda"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
    "ydata-profiling>=4.0",
    "pyod>=1.0",
    "pydbml>=1.0",
    "pyampute>=0.0.3",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "matplotlib>=3.0",
    "seaborn>=0.12",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyrefly]
search_path = ["src"]
site_package_path = ["auto"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
